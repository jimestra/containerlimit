[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jimestra-containerlimit"
version = "0.1.0"
description = "从输入中抽取数值，计算容器内的资源限额相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jimestra" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jimestra.github.io"
Repository = "https://github.com/jimestra/containerlimit"
Issues = "https://github.com/jimestra/containerlimit/issues"

[project.scripts]
containerlimit = "containerlimit:main"

[tool.setuptools]
py-modules = ["containerlimit"]
